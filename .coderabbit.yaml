language: "ko-KR"
early_access: false

tone_instructions: "시니어 Flutter 개발자의 관점에서 한국어로 리뷰해주세요. 버그, 성능, 안정성, 유지보수성을 우선 검토하고, 단순 포맷팅보다 실제 문제가 될 수 있는 부분을 중심으로 설명해주세요. 초보자도 이해할 수 있게 이유와 개선 방향을 함께 제시해주세요."

reviews:
  profile: "chill"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true

path_filters:
  - "!build/**"
  - "!ios/Pods/**"
  - "!android/.gradle/**"
  - "!node_modules/**"

ignore_patterns:
  - "*.lock"
  - "*.md"
  - "*.json"

chat:
  auto_reply: true
