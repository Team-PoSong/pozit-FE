name: pozit
description: "Pozit Frontend Repository"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.9.1
  flutter_riverpod: ^3.2.0
  flutter_svg: ^2.2.3
  google_fonts: ^8.0.0
  flutter_screenutil: ^5.9.3
  google_sign_in: ^7.2.0
  flutter_secure_storage: ^10.0.0
  image_picker: ^1.2.1
  kakao_flutter_sdk_user: ^2.0.0+1
  kakao_map_sdk: ^1.2.6
  geolocator: ^14.0.3
  sign_in_with_apple: ^8.1.0
  crypto: ^3.0.7
  uuid: ^4.5.1
  camera: ^0.12.0+2
  gal: ^2.3.3
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  video_player: ^2.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/

  fonts:
    - family: Pretendard
      fonts:
        - asset: assets/fonts/Pretendard-Light.otf
          weight: 300
        - asset: assets/fonts/Pretendard-Regular.otf
          weight: 400
        - asset: assets/fonts/Pretendard-Medium.otf
          weight: 500
        - asset: assets/fonts/Pretendard-SemiBold.otf
          weight: 600
